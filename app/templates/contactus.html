{% extends "base.html" %}

{% block title %}Contact Us - CareSlotly{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="row g-0">
                        <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-light">
                            <img src="{{ url_for('static', filename='images/contact-us-illustration.svg') }}"
                                alt="Contact Us" class="img-fluid p-5">
                        </div>
                        <div class="col-lg-6 p-4 p-md-5">
                            <h2 class="text-center mb-4">Contact Us</h2>
                            <p class="text-center text-muted mb-4">We'd love to hear from you! Please fill out the form below and we will get in
                                touch with you shortly.</p>
                            
                            <form>
                                <div class="mb-3">
                                    <label for="name" class="form-label">Your Name</label>
                                    <input type="text" class="form-control" id="name" required>
                                </div>
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email Address</label>
                                    <input type="email" class="form-control" id="email" required>
                                </div>
                                <div class="mb-3">
                                    <label for="subject" class="form-label">Subject</label>
                                    <input type="text" class="form-control" id="subject">
                                </div>
                                <div class="mb-3">
                                    <label for="message" class="form-label">Message</label>
                                    <textarea class="form-control" id="message" rows="5" required></textarea>
                                </div>
                                <div class="d-grid">
                                    <button type="submit" class="btn btn-primary">Send Message</button>
                                </div>
                                </form>
                                </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
